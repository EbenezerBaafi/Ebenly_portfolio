<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ project.title }}</title>
</head>
<body>
    <a href="{% url 'project_index' %}">← Back to All Projects</a>
    
    <h1>{{ project.title }}</h1>
    
    {% if project.image %}
        <img src="{{ project.image.url }}" alt="{{ project.title }}" style="max-width: 600px; height: auto;">
    {% endif %}
    
    <h3>Details:</h3>
    <p>{{ project.description|linebreaks }}</p> 
    
    {% if project.link %}
        <p>
            Check out the live project: 
            <a href="{{ project.link }}" target="_blank">Go to Project Link</a>
        </p>
    {% endif %}

</body>
</html>
